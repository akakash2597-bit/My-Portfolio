<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Portfolio Builder</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- 🌌 Particles -->
<div class="particles"></div>

<!-- 🚀 Welcome Page -->
<section id="welcome-page" class="page active">

    <div class="welcome-box fade-in">

        <h1>🚀 Portfolio Builder</h1>

        <p>Create your futuristic portfolio app</p>

        <button onclick="goToFormPage()">
            START
        </button>

    </div>

</section>

<!-- 📝 Form Page -->
<section id="form-page" class="page">

    <div class="form-box fade-in">

        <!-- 🔥 Navigation -->
        <div class="navbar">

            <h3>⚡ Portfolio App</h3>

            <button onclick="toggleTheme()">
                🌙
            </button>

        </div>

        <h2>📝 Fill Your Portfolio</h2>

        <input type="text"
            id="name"
            placeholder="Your Name">

        <input type="text"
            id="role"
            placeholder="Your Role">

        <textarea id="about"
            placeholder="About You"></textarea>

        <input type="text"
            id="skills"
            placeholder="Skills (HTML,CSS,JS)">

        <input type="text"
            id="project"
            placeholder="Project Link">

        <!-- 🖼 Upload -->
        <input type="file" id="photo">

        <button onclick="generatePortfolio()">
            GENERATE PORTFOLIO
        </button>

    </div>

</section>

<!-- 🌐 Portfolio Page -->
<section id="portfolio-page" class="page">

    <div class="portfolio-card fade-in">

        <!-- 🔥 Navigation -->
        <div class="navbar">

            <h3>⚡ My Portfolio</h3>

            <button onclick="toggleTheme()">
                🌙
            </button>

        </div>

        <!-- 🖼 Profile -->
        <img id="profile-image">

        <h1 id="portfolio-name"></h1>

        <h3 id="portfolio-role"></h3>

        <p id="portfolio-about"></p>

        <!-- 🛠 Skills -->
        <div id="portfolio-skills"></div>

        <!-- 🔗 Project -->
        <a id="portfolio-project"
            target="_blank">
            🔗 View Project
        </a>

        <!-- 📄 Resume -->
        <button onclick="downloadPortfolio()">
            📄 Download Resume
        </button>

        <!-- 📱 Install App -->
        <button id="installBtn"
            style="display:none;">
            📱 Install App
        </button>

    </div>

</section>

<!-- 🎵 Sounds -->
<audio id="clickSound"
    src="sounds/click.mp3"></audio>

<audio id="successSound"
    src="sounds/success.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
